name: Build desktop app

# Run from the Actions tab ("Run workflow"). Builds the Windows installer and the
# Linux AppImage from the same commit and uploads both as workflow artifacts.
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS .exe)
            os: windows-latest
            bundle: nsis
            artifact: moodist-windows
            path: desktop/target/release/bundle/nsis/*.exe
          # Oldest supported runner, so the AppImage runs on older glibc too.
          - name: Linux (AppImage)
            os: ubuntu-22.04
            bundle: appimage
            artifact: moodist-linux
            path: desktop/target/release/bundle/appimage/*.AppImage

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libpulse-dev libfuse2 patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - run: npm ci --no-audit --no-fund

      - name: Build bundle
        run: npm run bundle -- --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
