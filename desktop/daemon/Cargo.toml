[package]
name = "moodistd"
version = "0.1.0"
description = "Moodist audio daemon: playback, timers, playlist and tray"
edition = "2021"

[dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
libpulse-binding = "2"
libpulse-simple-binding = "2"
png = "0.17"
rodio = { version = "0.21", default-features = false, features = ["mp3", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
