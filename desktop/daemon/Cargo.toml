[package]
name = "moodistd"
version = "0.1.0"
description = "Moodist audio daemon: playback, timers, playlist and tray"
edition = "2021"

[dependencies]
png = "0.17"
rodio = { version = "0.21", default-features = false, features = ["mp3", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libpulse-binding = "2"
libpulse-simple-binding = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.16"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
