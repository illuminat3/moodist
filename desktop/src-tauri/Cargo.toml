[package]
name = "moodist"
version = "0.1.0"
description = "Ambient sounds for focus and calm"
edition = "2021"

[lib]
name = "moodist_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
